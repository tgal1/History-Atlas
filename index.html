<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>History Atlas</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/map.css">
  <link rel="stylesheet" href="css/panel.css">
  <link rel="stylesheet" href="css/timeline.css">
</head>
<body>
  <div id="map" aria-label="Map"></div>
  <!-- 3D city view, laid over the map while exploring a city -->
  <div id="city3d" class="city3d" hidden>
    <div class="map3d" aria-label="3D city"></div>
    <p class="status3d" hidden></p>
    <p class="hint3d">Drag to move · right-drag or Ctrl+drag to tilt and turn · click a building</p>
  </div>

  <!-- Story title and current chapter -->
  <header class="hud">
    <div class="hud-top">
      <span class="brand">History Atlas</span>
      <button id="btn-menu" class="menu-btn" aria-haspopup="dialog">&#9776; Stories &amp; cities</button>
    </div>
    <h1 id="story-title"></h1>
    <p id="story-subtitle" class="hud-sub"></p>
    <div class="hud-era">
      <span class="eyebrow">Chapter</span>
      <strong id="era-title"></strong>
      <p id="era-text"></p>
    </div>
  </header>

  <aside id="legend" class="legend"></aside>
  <div class="city-tools">
    <button id="city-chip" class="city-chip" hidden></button>
    <button id="btn-3d" class="city-chip btn-3d" hidden>View in 3D</button>
  </div>
  <!-- Blend the drawn city plan with modern satellite imagery -->
  <div id="then-now" class="then-now" hidden>
    <span>Then</span>
    <input type="range" min="0" max="100" value="0" aria-label="Blend the ancient plan with today's satellite view">
    <span>Today</span>
  </div>

  <!-- Event card, intro and city guide -->
  <aside id="panel" class="panel">
    <div class="panel-tabs" role="tablist">
      <button role="tab" data-tab="event" aria-selected="true">Story</button>
      <button id="btn-intro" class="tab-link" title="Back to the introduction">Intro</button>
      <button id="panel-close" class="icon-btn" aria-label="Show or hide panel">&#8250;</button>
    </div>
    <div id="panel-event" class="panel-body"></div>
  </aside>

  <!-- Scene (animated close-up) controls -->
  <section id="scene-bar" class="scene-bar" hidden></section>

  <!-- Timeline -->
  <footer class="timeline">
    <div class="tl-controls">
      <button id="btn-prev" class="icon-btn" aria-label="Previous event" title="Previous event (←)">&#9664;&#9664;</button>
      <button id="btn-play" class="play-btn" aria-label="Play" title="Play / pause (space)">&#9654;</button>
      <button id="btn-next" class="icon-btn" aria-label="Next event" title="Next event (→)">&#9654;&#9654;</button>
      <div class="tl-date-wrap">
        <span id="tl-date" class="tl-date"></span>
      </div>
      <div class="tl-options">
        <button id="btn-sound" class="sound-btn" aria-haspopup="dialog" aria-expanded="false" title="Narration, sounds and music">
          <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M4 9h4l5-4v14l-5-4H4z"/><path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
          <span>Sound</span>
        </button>
        <label class="toggle"><input id="tour-mode" type="checkbox" checked> Stop at events</label>
        <select id="speed" aria-label="Tour speed">
          <option value="relaxed">Relaxed</option>
          <option value="normal" selected>Normal</option>
          <option value="fast">Fast</option>
        </select>
      </div>
    </div>
    <div id="tl-track" class="tl-track" role="slider" aria-label="Timeline"></div>
  </footer>
  <div id="sound-panel" class="sound-panel" role="dialog" aria-label="Sound settings" hidden></div>

  <!-- Start menu: stories and cities -->
  <div id="menu" class="menu" hidden>
    <div class="menu-card" role="dialog" aria-modal="true" aria-label="Stories and cities" tabindex="-1">
      <header class="menu-head">
        <div>
          <span class="brand">History Atlas</span>
          <h2>Where to?</h2>
        </div>
        <button class="icon-btn" data-act="close" aria-label="Close menu">&times;</button>
      </header>
      <div class="menu-tabs" role="tablist">
        <button role="tab" data-tab="stories" aria-selected="true">Stories</button>
        <button role="tab" data-tab="cities" aria-selected="false">Cities</button>
      </div>
      <div class="menu-body"></div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script type="module" src="js/main.js"></script>
</body>
</html>
